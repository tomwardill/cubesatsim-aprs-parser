<html>

<body>

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #c {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>

    <style>
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display: block;
        }
    </style>

    <style>
        #sstv {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2vh;
            background: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 3vh;
        }

        #sstv.active {
            display: flex;
        }

        #sstv-frame {
            position: relative;
            height: 80vh;
            max-width: 95vw;
            aspect-ratio: 320 / 256;
            border: 3px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
        }

        #sstv-image {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* the line being received */
        #sstv-cursor {
            position: absolute;
            left: 0;
            right: 0;
            height: calc(100% / 256);
            background: #00ff00;
            box-shadow: 0 0 12px 3px rgba(0, 255, 0, 0.8);
            display: none;
        }
    </style>

    <style>
        /* sits above both the cube and the SSTV image */
        #banner {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: none;
            padding: 1.5vh 2vw;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            font-size: 3vh;
            letter-spacing: 0.1em;
            animation: banner-pulse 1.5s ease-in-out infinite;
        }

        #banner.active {
            display: block;
        }

        @keyframes banner-pulse {
            50% {
                opacity: 0.55;
            }
        }
    </style>

    <canvas id="c"></canvas>

    <div id="banner"></div>

    <div id="sstv">
        <div id="sstv-frame">
            <canvas id="sstv-image" width="320" height="256"></canvas>
            <div id="sstv-cursor"></div>
        </div>
        <div id="sstv-status">WAITING FOR SSTV IMAGE</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
                "three/examples/jsm/lines/LineMaterial.js": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/lines/LineMaterial.js",
                "three/examples/jsm/lines/LineSegments2.js": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/lines/LineSegments2.js",
                "three/addons/lines/LineSegmentsGeometry.js": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/lines/LineSegmentsGeometry.js",
                "mqtt": "https://unpkg.com/mqtt/dist/mqtt.esm.js"
            }
        }
        </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { LineMaterial } from 'three/examples/jsm/lines/LineMaterial.js';
        import { LineSegments2 } from 'three/examples/jsm/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import mqtt from 'mqtt';

        function resizeRendererToDisplaySize(renderer) {
            const canvas = renderer.domElement;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const needResize = canvas.width !== width || canvas.height !== height;
            if (needResize) {
                renderer.setSize(width, height, false);
            }
            return needResize;
        }

        function main() {

            const canvas = document.querySelector('#c');
            const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });

            const fov = 75;
            const aspect = 2; // the canvas default
            const near = 0.1;
            const far = 5;
            const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            camera.position.z = 2;


            const scene = new THREE.Scene();

            function convertToWireframe(geometry) {
                const wireframeGeometry = new THREE.WireframeGeometry(geometry);

                const wireframeMaterial = new LineMaterial({
                    color: 0x00ff00,
                    linewidth: 3,
                    opacity: 0.75,
                    transparent: true
                });

                const lineSegmentsGeometry = new LineSegmentsGeometry();
                lineSegmentsGeometry.fromWireframeGeometry(wireframeGeometry);

                const line = new LineSegments2(lineSegmentsGeometry);
                line.material = wireframeMaterial;
                return line;
            }

            const pivot = new THREE.Object3D();

            const bodyGeometry = new THREE.BoxGeometry(1, 1, 1);

            const bodyWireframe = convertToWireframe(bodyGeometry);
            bodyWireframe.position.set(0, 0, 0);
            //scene.add(bodyWireframe);

            const antennaGeometryLeft = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 5);
            const antennaWireframeLeft = convertToWireframe(antennaGeometryLeft);
            antennaWireframeLeft.position.set(-0.4, 0.75, 0.4);
            //scene.add(antennaWireframeLeft);

            const antennaGeometryRight = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 5);
            const antennaWireframeRight = convertToWireframe(antennaGeometryRight);
            antennaWireframeRight.position.set(0.4, 0.75, 0.4);
            //scene.add(antennaWireframeRight);

            pivot.add(bodyWireframe);
            pivot.add(antennaWireframeLeft);
            pivot.add(antennaWireframeRight);
            scene.add(pivot);

            pivot.rotation.set(45.0, 0.0, 0.0);

            // SSTV view: the image is painted a line at a time as it is decoded
            const sstvView = document.querySelector('#sstv');
            const sstvStatus = document.querySelector('#sstv-status');
            const sstvCursor = document.querySelector('#sstv-cursor');
            const sstvImage = document.querySelector('#sstv-image');
            const sstvContext = sstvImage.getContext('2d');
            sstvContext.fillStyle = '#000';
            sstvContext.fillRect(0, 0, sstvImage.width, sstvImage.height);

            // A button press picks the view straight away. The CubeSatSim takes a
            // while to follow (it finishes what it is sending first), so what it is
            // still sending in the old mode mustn't flip the view back in the
            // meantime. buttons.py retries up to 3 times, about 12 s apart waiting
            // for telemetry and about 92 s apart waiting for an image to end.
            const MODE_TIMEOUT = { sstv: 45, aprs: 300 };
            const banner = document.querySelector('#banner');
            let viewHeldUntil = 0;
            let pendingMode = null;
            let pendingTimer = null;

            function requestMode(mode) {
                pendingMode = mode;
                banner.textContent = `CHANGING TO ${mode.toUpperCase()} MODE AT END OF TRANSMISSION`;
                banner.classList.add('active');
                clearTimeout(pendingTimer);
                pendingTimer = setTimeout(() => modeTimedOut(mode), MODE_TIMEOUT[mode] * 1000);
                showView(mode === 'sstv' ? 'sstv' : 'telemetry', MODE_TIMEOUT[mode]);
            }

            // the CubeSatSim is sending in the mode we asked for
            function modeConfirmed(mode) {
                if (pendingMode !== mode) {
                    return;
                }
                pendingMode = null;
                clearTimeout(pendingTimer);
                banner.classList.remove('active');
            }

            function cancelRequest() {
                pendingMode = null;
                clearTimeout(pendingTimer);
                banner.classList.remove('active');
                // let whatever the CubeSatSim sends next pick the view again
                viewHeldUntil = 0;
            }

            function modeTimedOut(mode) {
                if (pendingMode !== mode) {
                    return;
                }
                pendingMode = null;
                banner.textContent = `${mode.toUpperCase()} MODE NOT CONFIRMED - PRESS THE BUTTON AGAIN`;
                setTimeout(() => banner.classList.remove('active'), 20000);
            }

            function showView(view, holdSeconds = 0) {
                const held = Date.now() < viewHeldUntil;
                if (holdSeconds) {
                    viewHeldUntil = Date.now() + holdSeconds * 1000;
                } else if (held) {
                    return;
                }
                sstvView.classList.toggle('active', view === 'sstv');
            }

            function drawSstvLine(line, rgb) {
                const bytes = Uint8Array.from(atob(rgb), c => c.charCodeAt(0));
                const row = sstvContext.createImageData(bytes.length / 3, 1);
                for (let i = 0; i < bytes.length / 3; i++) {
                    row.data.set([bytes[i * 3], bytes[i * 3 + 1], bytes[i * 3 + 2], 255], i * 4);
                }
                sstvContext.putImageData(row, 0, line);
                sstvCursor.style.display = 'block';
                sstvCursor.style.top = `${(line + 1) / sstvImage.height * 100}%`;
                sstvStatus.textContent = `RECEIVING SSTV IMAGE - LINE ${line + 1} / ${sstvImage.height}`;
            }

            let client = mqtt.connect('mqtt://' + window.location.hostname + ':9001');

            client.on('connect', function () {
                console.log('Connected to MQTT broker');
                client.subscribe('cubesatsim/data', function (err) {
                    if (!err) {
                        console.log('Subscribed to cubesatsim/data');
                    } else {
                        console.error('Subscription error:', err);
                    }
                });
                client.subscribe('cubesatsim/actions', function (err) {
                    if (!err) {
                        console.log('Subscribed to cubesatsim/actions');
                    } else {
                        console.error('Subscription error:', err);
                    }
                });
                client.subscribe('cubesatsim/sstv/#', function (err) {
                    if (!err) {
                        console.log('Subscribed to cubesatsim/sstv/#');
                    } else {
                        console.error('Subscription error:', err);
                    }
                });
            });

            client.on("message", (topic, message) => {
                // message is Buffer
                if (topic === 'cubesatsim/sstv/line') {
                    const data = JSON.parse(message.toString());
                    drawSstvLine(data.line, data.rgb);
                    modeConfirmed('sstv');
                    showView('sstv');
                    return;
                }
                console.log(message.toString());

                if (topic === 'cubesatsim/sstv/start') {
                    sstvStatus.textContent = 'SSTV IMAGE STARTING';
                    modeConfirmed('sstv');
                    showView('sstv');
                }
                else if (topic === 'cubesatsim/sstv/end') {
                    sstvCursor.style.display = 'none';
                    sstvStatus.textContent = 'IMAGE COMPLETE - WAITING FOR NEXT IMAGE';
                }
                else if (topic === 'cubesatsim/actions') {
                    const action = JSON.parse(message.toString());
                    if (action.hasOwnProperty('action')) {
                        console.log(`Received action: ${action.action}`);
                        if (action.action === 'reset') {
                            // Handle reset action
                            console.log('Resetting...');
                            pivot.rotation.set(0.0, 0.0, 0.0);
                            cancelRequest();
                        }
                        else if (action.action === 'sstv') {
                            sstvStatus.textContent = 'SSTV MODE REQUESTED - WAITING FOR IMAGE';
                            requestMode('sstv');
                        }
                        else if (action.action === 'aprs') {
                            requestMode('aprs');
                        }
                    }
                }
                else if (topic === 'cubesatsim/data') {
                    modeConfirmed('aprs');
                    showView('telemetry');
                    const data = JSON.parse(message.toString());
                    if (data.hasOwnProperty('mpu_roll')) {
                        const roll = data.mpu_roll * (Math.PI / 180);
                        const pitch = data.mpu_pitch * (Math.PI / 180);
                        const yaw = data.mpu_yaw * (Math.PI / 180);

                        console.log(`Roll: ${roll}, Pitch: ${pitch}, Yaw: ${yaw}`);
                        pivot.rotation.set(pitch, yaw, roll);
                    }
                }
            });

            function render(time) {

                time *= 0.001; // convert time to seconds
                if (resizeRendererToDisplaySize(renderer)) {
                    const canvas = renderer.domElement;
                    camera.aspect = canvas.clientWidth / canvas.clientHeight;
                    camera.updateProjectionMatrix();
                }

                requestAnimationFrame(render);

                renderer.render(scene, camera);

            }

            requestAnimationFrame(render);

        }

        main();

    </script>
</body>

</html>
